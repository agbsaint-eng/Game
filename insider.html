<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ef492c">
<title>اینسایدر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7f4;--tx:#231f20;--pr:#ef492c;--cd:#ffffff;--bd:#f0d9d2;--mu:#8a7a76;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231f20;--tx:#fff7f4;--cd:#302a2b;--bd:#4a4041;--mu:#a89a96}}
:root[data-theme="dark"]{--bg:#231f20;--tx:#fff7f4;--cd:#302a2b;--bd:#4a4041;--mu:#a89a96}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px Vazirmatn,system-ui,Tahoma,sans-serif;-webkit-text-size-adjust:100%;min-height:100vh}
#app{max-width:480px;margin:auto;padding:14px}
button{font:inherit;background:var(--pr);color:#fff;border:0;border-radius:14px;padding:12px 16px;margin:4px 0;cursor:pointer}
button.g{background:var(--cd);color:var(--tx);border:2px solid var(--bd)}
.b{display:block;width:100%}
.c{background:var(--cd);border:2px solid var(--bd);border-radius:16px;padding:12px;margin:8px 0}
input{font:inherit;width:100%;padding:10px;border-radius:12px;border:2px solid var(--bd);background:var(--cd);color:var(--tx);margin:4px 0}
.c.hd{width:96px;height:96px;padding:0;margin:8px auto;overflow:hidden}
img.lg{width:100%;height:100%;object-fit:cover;display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}
.st{display:flex;align-items:center;gap:10px}
.st button{width:40px;height:40px;border-radius:50%;padding:0;margin:0;font-size:22px;background:var(--cd);color:var(--tx);border:2px solid var(--bd)}
.st span{min-width:32px;text-align:center;font-weight:700;font-size:20px}
.ch{display:inline-block;padding:6px 12px;margin:3px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font:inherit;cursor:pointer}
.ch.y{background:#ffe14d;color:#231f20;border-color:#e6c200}
.ch.x{cursor:default}
.ch.x b{margin-inline-start:8px;color:var(--pr);cursor:pointer;font-size:18px;line-height:1}
.big{font-size:30px;font-weight:700;text-align:center;padding:12px 8px;color:var(--pr)}
.secret{border-radius:20px;padding:34px 12px;margin:14px 0;text-align:center;background:var(--cd);border:2px dashed var(--bd)}
.secret.spy{border-color:var(--pr)}
.secret small{display:block;color:var(--mu);font-size:14px;margin:6px 0}
.secret .w{font-size:34px;font-weight:700}
.t{font-size:64px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;direction:ltr;margin:10px 0}
.t.low{color:var(--pr)}
.dots{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin:6px 0}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--bd)}
.dots i.d{background:var(--pr)}
.hint{color:var(--mu);font-size:14px;text-align:center;line-height:1.9}
.ct{text-align:center}
h2{margin:6px 0;font-size:22px;text-align:center}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
.li:last-child{border:0}
.li span{flex:1;cursor:pointer}
.li small{color:var(--mu)}
.li button{margin:0;padding:6px 12px;font-size:14px}
.gear{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;width:42px;height:42px;padding:0;border-radius:50%;font-size:20px}
.gear.rt{left:auto;right:14px}
.c h3{margin:0 0 6px;font-size:17px;color:var(--pr)}
.c p{margin:6px 0;line-height:1.9}
.c ol,.c ul{margin:6px 0;padding-inline-start:22px;line-height:1.9}
.ex{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;line-height:1.9;font-size:15px}
footer{text-align:center;opacity:.6;font-size:13px;margin:20px 0 28px}
</style>

const S={rw:false,players:5,mins:5,dmins:2,sel:new Set(Object.keys(cats)),word:'',cat:'',master:0,insider:1,i:0,left:0,tm:null,last:''};

function stepper(k,min,max,lbl){return `<div class="row"><b>${lbl}</b><div class="st"><button onclick="chg('${k}',-1,${min},${max})">−</button><span>${fa(S[k])}</span><button onclick="chg('${k}',1,${min},${max})">+</button></div></div>`}
function chg(k,d,min,max){S[k]=Math.min(max,Math.max(min,S[k]+d));setup()}
function tgl(k){S[k]=!S[k];setup()}
function tog(i){const c=Object.keys(cats)[i];S.sel.has(c)?S.sel.delete(c):S.sel.add(c);setup()}

function setup(){stopMel();
clearInterval(S.tm);
const names=Object.keys(cats);
S.sel=new Set([...S.sel].filter(c=>cats[c]));
if(!S.sel.size&&names.length)S.sel.add(names[0]);
app.innerHTML=`<button class="g gear" onclick="admin()" aria-label="مدیریت">⚙️</button><button class="g gear rt" onclick="help()" aria-label="راهنما">❓</button>${head()}

function start(){unlock();stopMel();
const pool=(S.rw?Object.keys(cats):[...S.sel]).flatMap(c=>(cats[c]||[]).map(w=>[c,w]));
if(!pool.length){alert('کلمه‌ای باقی نمانده است. از ⚙️ کلمات استفاده‌شده را برگردانید یا کلمه جدید اضافه کنید.');return}
let pl=pool.filter(p=>p[1]!==S.last);if(!pl.length)pl=pool;
const [c,w]=pl[rnd(pl.length)];S.cat=c;S.word=w;S.last=w;cats[c]=cats[c].filter(x=>x!==w);(used[c]=used[c]||[]).push(w);save();
S.master=rnd(S.players);
do{S.insider=rnd(S.players)}while(S.insider===S.master);
S.i=0;pass()}

const dots=()=>`<div class="dots">${[...Array(S.players)].map((_,i)=>`<i class="${i<S.i?'d':''}"></i>`).join('')}</div>`;

if(m)card=`<small>نقش تو</small><div class="w" style="color:var(--pr)">🎩 کلمه‌دان</div><small style="margin-top:12px">کلمه مخفی</small><div class="w">${E(S.word)}</div><small style="margin-top:12px">نقشت را علنی اعلام کن و فقط بله، خیر یا نمی‌دانم بگو.</small>`;

app.innerHTML=`${head()}<div class="ct"><h2>نتیجه</h2>
${ok?'':'<p class="hint">کلمه پیدا نشد؛ همه باختند.</p>'}
<div class="c"><p class="hint">کلمه مخفی</p><div class="big">${E(S.word)}</div></div>
<div class="c"><p class="hint">کلمه‌دان</p><div class="big" style="padding:4px">🎩 بازیکن ${fa(S.master+1)}</div></div>

function help(){
clearInterval(S.tm);
app.innerHTML=`<button class="g gear rt" onclick="setup()" aria-label="بازگشت">✕</button>${head()}<h2>راهنمای بازی اینسایدر</h2>
<div class="c"><h3>ایدهٔ بازی</h3><p>یک کلمهٔ مخفی انتخاب می‌شود. گروه باید با سؤال‌های بله/خیر آن را حدس بزند. اما یک نفر به اسم «اینسایدر» کلمه را از اول می‌داند و مخفیانه گروه را به جواب نزدیک می‌کند. بعد از پیدا شدن کلمه، همه باید بفهمند اینسایدر کی بوده است.</p></div>
<div class="c"><h3>نقش‌ها</h3><ul><li><b>🎩 کلمه‌دان:</b> کلمه را می‌داند و نقشش را <b>علنی</b> اعلام می‌کند. فقط می‌گوید «بله»، «خیر» یا «نمی‌دانم». حق ندارد سرنخ دیگری بدهد.</li><li><b>🕵️ اینسایدر:</b> او هم کلمه را می‌داند، اما نقشش <b>مخفی</b> است. باید با سؤال‌های هوشمندانه گروه را هدایت کند، بدون این‌که لو برود.</li><li><b>👥 عادی:</b> کلمه را نمی‌داند و باید با سؤال بله/خیر آن را پیدا کند.</li></ul><p>در هر دور یک کلمه‌دان، یک اینسایدر و بقیه عادی هستند.</p></div>
<div class="c"><h3>مراحل بازی</h3><ol><li><b>تنظیمات:</b> تعداد بازیکنان (۳ تا ۲۰)، زمان حدس کلمه، زمان بحث و دسته‌های کلمه را انتخاب کنید و «شروع بازی» را بزنید.</li><li><b>پخش کارت‌ها:</b> گوشی دست‌به‌دست می‌شود. هر نفر «نمایش کارت من» را می‌زند، نقشش را می‌بیند، «فهمیدم، پنهان کن» را می‌زند و گوشی را به نفر بعد می‌دهد. مراقب باشید کسی صفحهٔ بقیه را نبیند.</li><li><b>حدس کلمه:</b> بازیکنی که کلمه‌دان بود خودش را معرفی می‌کند و گوشی را وسط می‌گذارند. تایمر شروع می‌شود و بقیه از کلمه‌دان سؤال بله/خیر می‌پرسند. دسته‌ی کلمه (مثلاً «مکان‌ها») روی صفحه نوشته شده است.</li><li><b>پیدا شدن کلمه:</b> وقتی کسی کلمه را درست گفت، «کلمه حدس زده شد» را بزنید.</li><li><b>پیدا کردن اینسایدر:</b> تایمر دوم شروع می‌شود. همه بحث می‌کنند که چه کسی بیشتر از بقیه جواب را هدایت می‌کرد، بعد با هم رأی می‌دهند.</li><li><b>نتیجه:</b> «پایان رأی‌گیری و نمایش نتیجه» را بزنید تا کلمه، کلمه‌دان و اینسایدر نمایش داده شوند.</li></ol></div>
<div class="c"><h3>برد و باخت</h3><ul><li>اگر زمان حدس تمام شود و کلمه پیدا نشود، <b>همه می‌بازند</b> (اینسایدر هم).</li><li>اگر کلمه پیدا شود و گروه اینسایدر را درست رأی بدهد، <b>گروه می‌برد</b>.</li><li>اگر کلمه پیدا شود ولی گروه اشتباه رأی بدهد، <b>اینسایدر می‌برد</b>.</li><li>کلمه‌دان در برد گروه شریک است و اگر کلمه پیدا نشود می‌بازد.</li></ul></div>
<div class="c"><h3>مثال یک دور</h3><p>۵ بازیکن هستند. کلمه «فرودگاه» از دستهٔ «مکان‌ها» است. بازیکن ۲ کلمه‌دان و بازیکن ۴ اینسایدر شده است.</p><div class="ex">بازیکن ۲: «من کلمه‌دانم. فقط بله یا خیر جواب می‌دهم.»</div><div class="ex">بازیکن ۱: «آیا آن جا سرپوشیده است؟» ← کلمه‌دان: «بله.»</div><div class="ex">بازیکن ۳: «آیا مردم آن جا زندگی می‌کنند؟» ← «خیر.»</div><div class="ex">بازیکن ۴ (اینسایدر): «آیا آن جا برای سفر استفاده می‌شود؟» ← «بله.» (سؤال خوبی است، گروه را نزدیک می‌کند ولی خیلی مشکوک نیست.)</div><div class="ex">بازیکن ۵: «آیا هواپیما آن جا هست؟» ← «بله.»</div><div class="ex">بازیکن ۱: «فرودگاه؟» ← «بله، درست است!»</div><p>حالا «کلمه حدس زده شد» را می‌زنند. در بحث، بازیکن ۵ می‌گوید: «سؤال بازیکن ۴ خیلی دقیق بود.» بازیکن ۴ دفاع می‌کند. همه رأی می‌دهند و اگر اکثریت بازیکن ۴ را بگویند، گروه برده است.</p></div>
<div class="c"><h3>نکته‌ها و استراتژی</h3><ul><li><b>اینسایدر:</b> سؤال‌هایت را طبیعی و نه خیلی دقیق بپرس. اگر بیش از حد هدایت کنی لو می‌روی و اگر کم هدایت کنی وقت تمام می‌شود.</li><li><b>عادی‌ها:</b> سؤال‌ها را از کلی به جزئی بپرسید: «جاندار است؟»، «بیرون خانه است؟» و به سؤال‌های مشکوکِ بسیار دقیق دقت کنید.</li><li><b>کلمه‌دان:</b> فقط بله/خیر بگو. اگر سؤال مبهم است، «نمی‌دانم» بگو.</li><li>حدس زدن کلمه با گفتن مستقیم آن است، نه با سؤال.</li><li>مدت حدس را برای جمع‌های بزرگ‌تر بیشتر کنید.</li></ul></div>
<div class="c"><h3>مدیریت کلمه‌ها</h3><p>با دکمهٔ ⚙️ سمت چپ بالا می‌توانید دسته و کلمهٔ جدید بسازید یا کلمه‌ها را حذف کنید. هر کلمه بعد از استفاده به بخش «کلمات استفاده‌شده» می‌رود و دوباره نمی‌آید؛ از همان‌جا می‌توانید برش گردانید. نقش‌ها (کلمه‌دان و اینسایدر) هر دور کاملاً تصادفی پخش می‌شوند. دسته‌های پررنگ زردرنگ در صفحهٔ اصلی همان‌هایی هستند که در بازی استفاده می‌شوند.</p></div>
<button class="b" onclick="setup()">بازگشت به بازی</button>`}
function admin(){
clearInterval(S.tm);
const names=Object.keys(cats);
app.innerHTML=`${head()}<h2>پنل مدیریت</h2><p class="hint">روی نام دسته بزنید تا کلماتش را ویرایش کنید.</p>
<div class="c">${names.length?names.map((c,i)=>`<div class="li"><span onclick="editCat(${i})"><b>${E(c)}</b> <small>(${fa(cats[c].length)} کلمه، ${fa((used[c]||[]).length)} استفاده‌شده)</small></span><button class="g" onclick="delCat(${i})">حذف</button></div>`).join(''):'<p class="hint">دسته‌ای وجود ندارد.</p>'}</div>
<div class="c"><b>دسته جدید</b><input id="nc" placeholder="نام دسته، مثلاً: ورزش‌ها" maxlength="40"><button class="b" onclick="addCat()">افزودن دسته</button></div>
<button class="b g" onclick="resetAll()">بازگشت به دسته‌های پیش‌فرض</button>
<button class="b" onclick="setup()">بازگشت به بازی</button>`}
function addCat(){const el=document.getElementById('nc'),n=el.value.trim();if(!n)return;if(cats[n]){alert('این دسته از قبل وجود دارد');return}cats[n]=[];S.sel.add(n);save();editCat(Object.keys(cats).indexOf(n))}
function delCat(i){const c=Object.keys(cats)[i];if(!confirm('دسته «'+c+'» با همه کلماتش حذف شود؟'))return;delete cats[c];delete used[c];S.sel.delete(c);save();admin()}
function resetAll(){if(!confirm('دسته‌های پیش‌فرض برگردد؟'))return;cats=JSON.parse(JSON.stringify(DEF));used={};S.sel=new Set(Object.keys(cats));save();admin()}
function editCat(i){
const c=Object.keys(cats)[i];if(c===undefined)return admin();
app.innerHTML=`${head()}<h2>${E(c)}</h2><p class="hint">${fa(cats[c].length)} کلمه</p>
<div class="c"><b>افزودن کلمه</b><input id="nw" placeholder="یک یا چند کلمه (با ویرگول یا خط جدید جدا کنید)"><button class="b" onclick="addW(${i})">افزودن</button></div>
<div class="c">${cats[c].length?cats[c].map((w,j)=>`<span class="ch x">${E(w)}<b onclick="delW(${i},${j})" aria-label="حذف">×</b></span>`).join(''):'<p class="hint">این دسته خالی است.</p>'}</div>
<div class="c"><b>کلمات استفاده‌شده</b> <small style="color:var(--mu)">(${fa((used[c]||[]).length)})</small>${(used[c]||[]).length?`<div style="margin-top:6px">${used[c].map((w,j)=>`<span class="ch x">${E(w)}<b onclick="restW(${i},${j})" aria-label="بازگردانی">↩</b></span>`).join('')}</div><button class="b g" onclick="restAll(${i})">بازگرداندن همه به دسته</button>`:'<p class="hint">هنوز کلمه‌ای از این دسته استفاده نشده.</p>'}</div>
<button class="b g" onclick="admin()">بازگشت به دسته‌ها</button>`;
document.getElementById('nw').addEventListener('keydown',e=>{if(e.key==='Enter')addW(i)})}
function addW(i){const c=Object.keys(cats)[i],el=document.getElementById('nw');
el.value.split(/[,،\n]+/).map(s=>s.trim()).filter(Boolean).forEach(w=>{used[c]=(used[c]||[]).filter(x=>x!==w);if(!cats[c].includes(w))cats[c].push(w)});save();editCat(i)}
function delW(i,j){const c=Object.keys(cats)[i];cats[c].splice(j,1);save();editCat(i)}
function restW(i,j){const c=Object.keys(cats)[i],w=(used[c]||[])[j];if(w===undefined)return;used[c].splice(j,1);if(!cats[c].includes(w))cats[c].push(w);save();editCat(i)}
function restAll(i){const c=Object.keys(cats)[i];(used[c]||[]).forEach(w=>{if(!cats[c].includes(w))cats[c].push(w)});used[c]=[];save();editCat(i)}
setup();
</script>
